name: Workspace image smoke
on:
  pull_request:
    paths: ['.dockerignore', 'image/**', 'contract/**', 'core/**', 'orchestrator/**', 'researcher/**', 'pyproject.toml', 'uv.lock', '.github/workflows/workspace-image.yml']
permissions:
  contents: read
jobs:
  startup-sleep-restart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        application_protocol: [legacy, aide.1.0.0]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the self-contained image
        run: docker build --platform linux/amd64 -f image/Dockerfile -t distribution-smoke .
      - name: Verify packaged BuildKit client
        run: docker run --rm --entrypoint /usr/local/bin/buildctl distribution-smoke --version
      - name: Start, sleep, and restart with retained state
        env:
          STARTUP_CYCLES: "4"
          STARTUP_ARTIFACTS: ${{ runner.temp }}/startup-proof
        run: bash image/system_tests/start-stop.sh distribution-smoke "${{ matrix.application_protocol }}"
      - name: Retain startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-startup-${{ matrix.application_protocol }}
          path: ${{ runner.temp }}/startup-proof
