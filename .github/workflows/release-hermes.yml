name: Release hosted Hermes image

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "orchestrator/**"
      - "researcher/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release-hermes.yml"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger the independent image release
        env:
          GH_TOKEN: ${{ secrets.METTA_RELEASE_DISPATCH_TOKEN }}
        run: gh workflow run deploy-hermes-agent.yml --repo Metta-AI/metta --ref main
