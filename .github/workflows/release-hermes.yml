name: Release hosted Hermes image

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".dockerignore"
      - "core/**"
      - "orchestrator/**"
      - "researcher/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release-hermes.yml"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - id: origin
        name: Refuse to release after a failed nightly platform check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "started_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)" >> "$GITHUB_OUTPUT"
          # Only nightly runs on main count: a run on a branch (for example a rejected
          # workflow file on a pull request) must not block a release.
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow platform-check.yml \
            --branch main --event schedule --status completed --limit 1 \
            --json conclusion --jq '.[0].conclusion // "none"')
          echo "last nightly platform check: $conclusion"
          if [ "$conclusion" = "failure" ]; then
            echo "::error::the last nightly platform check failed; fix the route the tools use (or rerun the check) before releasing"
            exit 1
          fi
      - name: Trigger the independent image release
        env:
          GH_TOKEN: ${{ secrets.METTA_RELEASE_DISPATCH_TOKEN }}
          SOURCE_REVISION: ${{ github.sha }}
          RELEASE_STARTED_AT: ${{ steps.origin.outputs.started_at }}
        run: >-
          gh workflow run deploy-hermes-agent.yml --repo Metta-AI/metta --ref main
          -f "source_revision=$SOURCE_REVISION" -f "release_started_at=$RELEASE_STARTED_AT"
