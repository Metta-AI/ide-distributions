name: Workspace packaging comparison
on:
  pull_request:
    paths: ['image/Dockerfile', '.github/workflows/startup-benchmark.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build both packaging variants from the same source and lockfile
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_REF:image/Dockerfile" > "$RUNNER_TEMP/baseline.Dockerfile"
          # The baseline image must satisfy its own contracts, before candidate fixes.
          mkdir "$RUNNER_TEMP/baseline-check"
          git show "$BASE_REF:image/system_tests/check-terminal.py" > "$RUNNER_TEMP/baseline-check/check-terminal.py"
          git show "$BASE_REF:image/system_tests/check-contract.py" > "$RUNNER_TEMP/baseline-check/check-contract.py"
          printf '\nCOPY --from=baseline-check /check-terminal.py /opt/distribution/image/system_tests/check-terminal.py\n' >> "$RUNNER_TEMP/baseline.Dockerfile"
          printf '\nCOPY --from=baseline-check /check-contract.py /opt/distribution/image/system_tests/check-contract.py\n' >> "$RUNNER_TEMP/baseline.Dockerfile"
          docker build --platform linux/amd64 --build-context baseline-check="$RUNNER_TEMP/baseline-check" -f "$RUNNER_TEMP/baseline.Dockerfile" -t startup-baseline .
          docker build --platform linux/amd64 -f image/Dockerfile -t startup-candidate .
          docker image inspect startup-baseline startup-candidate --format '{{.RepoTags}} {{.Id}} {{.Size}}'
      - name: Measure baseline packaging
        env:
          STARTUP_CYCLES: "6"
          STARTUP_ARTIFACTS: ${{ runner.temp }}/baseline-proof
        run: bash image/system_tests/start-stop.sh startup-baseline
      - name: Measure candidate packaging
        env:
          STARTUP_CYCLES: "6"
          STARTUP_ARTIFACTS: ${{ runner.temp }}/candidate-proof
        run: bash image/system_tests/start-stop.sh startup-candidate
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-packaging-comparison
          path: |
            ${{ runner.temp }}/baseline.Dockerfile
            ${{ runner.temp }}/baseline-proof
            ${{ runner.temp }}/candidate-proof
