name: Workspace startup comparison
on:
  pull_request:
    paths: ['image/Dockerfile', 'image/runtime.py', 'core/src/research_core/prepare.py', '.github/workflows/startup-benchmark.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build baseline and candidate from their own source and lockfile
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline-source" "$BASE_REF"
          docker build --platform linux/amd64 -f "$RUNNER_TEMP/baseline-source/image/Dockerfile" -t startup-baseline "$RUNNER_TEMP/baseline-source"
          docker build --platform linux/amd64 -f image/Dockerfile -t startup-candidate .
          docker image inspect startup-baseline startup-candidate --format '{{.RepoTags}} {{.Id}} {{.Size}}'
      - name: Profile gateway imports in both packaged interpreters
        run: |
          for variant in baseline candidate; do
            for module in hermes_cli.main gateway.run; do
              docker run --rm --read-only --tmpfs /workspace:uid=10000,gid=10000,mode=0700 --tmpfs /tmp:mode=1777 \
                --entrypoint /opt/hermes/.venv/bin/python "startup-$variant" \
                -X importtime -c "import $module" > "$RUNNER_TEMP/$variant-$module-imports.log" 2>&1
            done
            docker run --rm --entrypoint /opt/hermes/.venv/bin/python "startup-$variant" \
              -c 'import pathlib,sysconfig; root=pathlib.Path("/opt/hermes"); site=pathlib.Path(sysconfig.get_path("purelib")); print("gateway pyc",len(list((root/"gateway").rglob("*.pyc"))),"CLI pyc",len(list((root/"hermes_cli").rglob("*.pyc"))),"dependency pyc",len(list(site.rglob("*.pyc"))))' \
              > "$RUNNER_TEMP/$variant-bytecode.txt"
          done
      - name: Measure baseline startup
        env:
          STARTUP_CYCLES: "6"
          STARTUP_ARTIFACTS: ${{ runner.temp }}/baseline-proof
        run: bash image/system_tests/start-stop.sh startup-baseline
      - name: Measure candidate startup
        env:
          STARTUP_CYCLES: "6"
          STARTUP_ARTIFACTS: ${{ runner.temp }}/candidate-proof
        run: bash image/system_tests/start-stop.sh startup-candidate
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-packaging-comparison
          path: |
            ${{ runner.temp }}/*-imports.log
            ${{ runner.temp }}/*-bytecode.txt
            ${{ runner.temp }}/baseline-proof
            ${{ runner.temp }}/candidate-proof
