name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Decides which test jobs a pull request can affect. Each filter starts from every file and
  # excludes what cannot change that job's result; both jobs always run (a skipped required
  # check counts as passing on main), and an unaffected job passes in about a minute.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      play: ${{ steps.filter.outputs.play }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            core:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!play/**'
              - '!.github/workflows/release-*.yml'
            play:
              - 'play/**'
              - '.github/workflows/ci.yml'

  core:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container:
      # The hosted Hermes runtime: its Python runs the plugin and prepare.py, exactly as hosting does.
      image: nousresearch/hermes-agent@sha256:9774f4f39a9bb8c2f68ce728ed5e99ddbad282163be56764afacf88ed952b784
      options: --user 0
    env:
      GIT_AUTHOR_NAME: IDE CI
      GIT_AUTHOR_EMAIL: ide-ci@example.invalid
      GIT_COMMITTER_NAME: IDE CI
      GIT_COMMITTER_EMAIL: ide-ci@example.invalid
      HERMES_BIN: /opt/hermes/.venv/bin/hermes
      HERMES_PYTHON: /opt/hermes/.venv/bin/python
      RUN_TESTS: ${{ github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.core == 'true' }}
    steps:
      - name: Skip when this change cannot affect the core
        if: env.RUN_TESTS != 'true'
        run: echo "No change in this pull request affects core/ or the profiles; skipping."
      - uses: actions/checkout@v4
        if: env.RUN_TESTS == 'true'
      - uses: astral-sh/setup-uv@v6
        if: env.RUN_TESTS == 'true'
        with:
          python-version: "3.12"
      - name: Mark the checkout safe for git
        if: env.RUN_TESTS == 'true'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: uv sync --frozen
        if: env.RUN_TESTS == 'true'
      - name: Lint
        if: env.RUN_TESTS == 'true'
        run: uv run ruff check .
      - name: Unit and scenario tests
        if: env.RUN_TESTS == 'true'
        run: uv run pytest -q
      - name: Tests against the installed Hermes
        if: env.RUN_TESTS == 'true'
        run: uv run pytest -q -m hermes core/tests/hermes

  play:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: nousresearch/hermes-agent@sha256:9774f4f39a9bb8c2f68ce728ed5e99ddbad282163be56764afacf88ed952b784
      options: --user 0
    env:
      GIT_AUTHOR_NAME: IDE CI
      GIT_AUTHOR_EMAIL: ide-ci@example.invalid
      GIT_COMMITTER_NAME: IDE CI
      GIT_COMMITTER_EMAIL: ide-ci@example.invalid
      HERMES_PYTHON: /opt/hermes/.venv/bin/python
      RUN_TESTS: ${{ github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.play == 'true' }}
    defaults:
      run:
        working-directory: play
    steps:
      - name: Skip when this change cannot affect play
        if: env.RUN_TESTS != 'true'
        working-directory: /
        run: echo "No change in this pull request affects play; skipping its tests."
      - uses: actions/checkout@v4
        if: env.RUN_TESTS == 'true'
      - uses: astral-sh/setup-uv@v6
        if: env.RUN_TESTS == 'true'
        with:
          python-version: "3.12"
      - name: Expose the installed Hermes runtime
        if: env.RUN_TESTS == 'true'
        run: echo /opt/hermes/.venv/bin >> "$GITHUB_PATH"
      - run: uv sync --frozen
        if: env.RUN_TESTS == 'true'
      - name: Lint
        if: env.RUN_TESTS == 'true'
        run: uv run ruff check .
      - run: uv run pytest -q
        if: env.RUN_TESTS == 'true'
      - name: Validate real Hermes plugin registration
        if: env.RUN_TESTS == 'true'
        run: uv run pytest -q -m hermes tests/test_hermes.py
