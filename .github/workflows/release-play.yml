name: Release hosted Play image

on:
  push:
    branches: [main]
    paths:
      - "play/**"
      - ".github/workflows/release-play.yml"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger the independent image release
        env:
          GH_TOKEN: ${{ secrets.METTA_RELEASE_DISPATCH_TOKEN }}
        run: gh workflow run deploy-play-agent.yml --repo Metta-AI/metta --ref main
