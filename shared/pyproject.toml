# Dependency source of truth for the standalone Hermes distributions.
# Run python3 tools/sync_shared.py, then uv lock --project <distribution>.
[project]
name = "ide-distributions-dependencies"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "python-frontmatter",
    "PyYAML",
    "coworld>=0.1.64,<0.2",
    "softmax-cli>=0.26.40,<0.27",
]

[project.optional-dependencies]
research = ["jsonschema", "numpy", "python-ulid", "scipy", "pandas"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.distributions.researcher]
extras = ["research"]
dev-dependencies = []

[tool.distributions.orchestrator]
extras = ["research"]
dev-dependencies = []

[tool.distributions.play]
extras = []
dev-dependencies = ["jsonschema"]
