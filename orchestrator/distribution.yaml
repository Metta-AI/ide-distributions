name: orchestrator
version: 0.1.0
description: Conversation-led research and platform discovery, coordinating native Hermes Kanban workers.
hermes_requires: ">=0.21.6"
env_requires:
  - name: OPENROUTER_API_KEY
    required: true
    description: OpenRouter API key for the orchestrator model.
  - name: OPENROUTER_MODEL
    required: false
    default: moonshotai/kimi-k3
    description: Model ID on OpenRouter.
  - name: SOFTMAX_PLAYER_CREDENTIAL
    required: true
    description: Bare player agent token or player-session JSON containing token and expires_at.
  - name: COGAMES_API_URL
    required: false
    default: https://softmax.com/api
    description: Softmax API server.
  - name: RESEARCH_PLAYER_ID
    required: true
    description: Credential player for authorized research writes; not the conversation subject.
  - name: RESEARCH_WORKSPACE
    required: true
    description: >-
      Absolute path to this profile's neutral canonical clone
      (other games: $HERMES_HOME/workspace-<game>).
  - name: RESEARCH_CANONICAL
    required: true
    description: >-
      Absolute path to the neutral shared bare canonical repository; selected games'
      repositories sit beside it as canonical-<game>.git.
  - name: TMPDIR
    required: false
    description: >-
      Scratch directory for builds and episodes. Set by Softmax hosting (/opt/data/tmp, because
      the sandbox /tmp is a small tmpfs); a manual install normally leaves it to the OS.
  - name: GOTA_HERMES_PYTHON
    required: false
    description: >-
      Python of the Hermes install, for GotA builds (games/gota/GAME.md host_requirements).
      Softmax hosting sets /opt/hermes/.venv/bin/python.
  - name: GOTA_G2_RUNNER
    required: false
    default: native
    description: >-
      GotA G2 episode runner. "native" runs the pinned native match binary and needs no
      Docker; "docker" runs pinned coworld run-episode (needs Docker).
  - name: RESEARCH_CREDIT_BACKOFF_MINUTES
    required: false
    default: "30"
    description: Minutes before the first relaunch of an experiment refused for credits (doubles per refusal, at most 8 hours).
  - name: RESEARCH_SOFTMAX
    required: false
    description: Set to "fake" in tests to use the fake Softmax tool instead of the real one.
