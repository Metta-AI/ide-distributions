[project]
name = "orchestrator"
version = "0.1.0"
description = "Research lead for native Hermes Kanban workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema",
    "pydantic>=2",
    "python-frontmatter",
    "numpy",
    "PyYAML",
    "python-ulid",
    "scipy",
    "pandas",
    "coworld>=0.1.66,<0.2",
    "softmax-cli>=0.26.40,<0.27",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator", "src/ide_research_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["hermes: needs a real Hermes install; excluded by default"]
addopts = "-m 'not hermes'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "src/ide_research_core",  # generated by tools/sync_shared.py; linted at its source
    "games/gota/compiler",  # vendored with SHA-256 provenance (PROVENANCE.md); keep bytes as pinned
]
