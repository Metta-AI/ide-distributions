# The orchestrator has everything a researcher has except the researcher's restrictions
# (plugins/researcher_guard, the researcher-only deny rules, the run budget): toolsets,
# timeouts, general environment, installed-game skills and fallback model match
# researcher/config.yaml.
model:
  default: moonshotai/kimi-k3
  provider: openrouter
fallback_providers:
  - provider: openrouter
    model: z-ai/glm-5.3
memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: false
agent:
  max_turns: 150
  # A chat reply has a user waiting on it. At 80% of this budget (12 minutes) Hermes tells the
  # model to stop discovery and answer from what it has; long work goes to the background or a
  # card (SOUL "Your own limits"). Without it, replies ran 17-24 minutes and ended with no result.
  run_budget_seconds: 900
# Every model call resends the whole session, and an IDE conversation is one long session.
# Hermes's default trigger is 50% of the window: 525,000 tokens for a 1.05M-token model such as
# openai/gpt-6-luna, so each call carried about 300,000 tokens and a 10-call reply read 3.6M.
# A fixed cap keeps calls at or below 200,000 tokens whatever model the platform routes to.
compression:
  threshold_tokens: 200000
# Chat gets the plugin tools plus the Hermes tools a researcher has: shell (terminal,
# process_manage), files, Python (execute_code), skills, web search and extraction, browser,
# image reading (vision), todo lists, past-session search, subagents (delegation) and memory.
# Not kanban (the card_* tools replace it) or cronjob (an enabled cron job keeps a hosted
# workspace awake). Approvals are off, as for researchers: a chat approval waits on a user who
# may not be watching, and cron runs have no one to ask. The deny list below stops identity
# changes, raw league submission (champion tools keep the records) and force pushes.
# Supervisor cron only wakes the coordinator, so it has no tools.
platform_toolsets:
  api_server: [orchestrator, memory, terminal, file, code_execution, skills, web, browser, vision, todo, session_search, delegation]
  cron: []
approvals:
  mode: "off"
  # Never prompt: "off" is Hermes's yolo mode. The per-context modes are backstops so an
  # unattended run approves rather than blocks if the mode is ever reset.
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: approve
  # Hermes matches these over the whole command and over each command word's tail
  # (tools/approval_detection.py _deny_command_variants), before mode and not overridable.
  # They catch habits and mistakes, not a determined script (python -c can call anything).
  deny:
    - "coworld player use*"
    - "coworld player unset*"
    - "softmax player use*"
    - "coworld submit"
    - "coworld submit *"
    - "*softmax exec*coworld submit"
    - "*softmax exec*coworld submit *"
    - "softmax login*"
    - "softmax logout*"
    - "softmax set-token*"
    - "softmax get-token*"
    - "*SOFTMAX_PLAYER_CREDENTIAL*"
    - "git push -f*"
    - "git push*--force*"
    - "git push* -f*"
    - "git *push*--force*"
    - "git push* +*"

terminal:
  # Longest process_manage wait (Hermes clamps a wait to it) and the default foreground timeout.
  timeout: 1800
  env_passthrough:
    - SSL_CERT_FILE
    - SOFTMAX_PLAYER_CREDENTIAL
    - COGAMES_API_URL
    - RESEARCH_PLAYER_ID
    - RESEARCH_GAME
    - RESEARCH_WORKSPACE
    - RESEARCH_CANONICAL
    - RESEARCH_EPISODE_LIMIT
    - RESEARCH_CLI
    - RESEARCH_SOFTMAX
    - SOFTMAX_BRIDGE_DIRECTORY
    - OPENROUTER_MODEL
    - TMPDIR
# Hermes cuts any single tool call after 420 s (agent/tool_executor.py), which would end a
# process_manage wait of up to terminal.timeout (1800) early. 1900 = that wait plus margin.
timeouts:
  tools:
    sequential_call: 1900
    concurrent_batch: 1900
plugins:
  enabled: [orchestrator]
# Installed games' binding skills, as for researchers (researcher/config.yaml).
skills:
  external_dirs:
    - ../../games
updates:
  check: false
curator:
  prune_builtins: false
