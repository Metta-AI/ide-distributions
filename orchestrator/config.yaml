# The orchestrator has everything a researcher has except the researcher's restrictions
# (plugins/researcher_guard, the approvals deny list, the run budget): toolsets, timeouts,
# general environment, installed-game skills and fallback model match researcher/config.yaml.
model:
  default: moonshotai/kimi-k3
  provider: openrouter
fallback_providers:
  - provider: openrouter
    model: z-ai/glm-5.3
memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: false
agent:
  max_turns: 150
# Chat gets the plugin tools plus the Hermes tools a researcher has: shell (terminal,
# process_manage), files, Python (execute_code), skills, web search and extraction, browser,
# image reading (vision), todo lists, past-session search, subagents (delegation) and memory.
# Not kanban (the card_* tools replace it) or cronjob (an enabled cron job keeps a hosted
# workspace awake). Dangerous commands go through Hermes approvals, which chat asks the user.
# Supervisor cron only wakes the coordinator, so it has no tools.
platform_toolsets:
  api_server: [orchestrator, memory, terminal, file, code_execution, skills, web, browser, vision, todo, session_search, delegation]
  cron: []
terminal:
  # Longest process_manage wait (Hermes clamps a wait to it) and the default foreground timeout.
  timeout: 1800
  env_passthrough:
    - SSL_CERT_FILE
    - SOFTMAX_PLAYER_CREDENTIAL
    - COGAMES_API_URL
    - RESEARCH_PLAYER_ID
    - RESEARCH_GAME
    - RESEARCH_WORKSPACE
    - RESEARCH_CANONICAL
    - RESEARCH_EPISODE_LIMIT
    - RESEARCH_CLI
    - RESEARCH_SOFTMAX
    - SOFTMAX_BRIDGE_DIRECTORY
    - OPENROUTER_MODEL
    - TMPDIR
# Hermes cuts any single tool call after 420 s (agent/tool_executor.py), which would end a
# process_manage wait of up to terminal.timeout (1800) early. 1900 = that wait plus margin.
timeouts:
  tools:
    sequential_call: 1900
    concurrent_batch: 1900
plugins:
  enabled: [orchestrator]
# Installed games' binding skills, as for researchers (researcher/config.yaml).
skills:
  external_dirs:
    - ../../games
updates:
  check: false
curator:
  prune_builtins: false
