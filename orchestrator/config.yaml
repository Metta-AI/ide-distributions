model:
  default: moonshotai/kimi-k3
  provider: openrouter
memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: false
agent:
  max_turns: 40
# Chat (api_server) and supervisor (cron) turns get the plugin tools plus Hermes's shell
# (terminal, process_manage), file (read_file, write_file, patch, search_files) and Python
# (execute_code) tools. Dangerous commands go through Hermes approvals: chat asks the user,
# unattended cron turns deny them (approvals.cron_mode default).
platform_toolsets:
  api_server: [orchestrator, terminal, file, code_execution, skills]
  cron: [orchestrator, terminal, file, code_execution, skills]
terminal:
  env_passthrough:
    - SOFTMAX_PLAYER_CREDENTIAL
    - COGAMES_API_URL
    - RESEARCH_PLAYER_ID
    - RESEARCH_GAME
    - RESEARCH_WORKSPACE
    - RESEARCH_CANONICAL
    - RESEARCH_EPISODE_LIMIT
    - RESEARCH_CLI
    - RESEARCH_SOFTMAX
    - SOFTMAX_BRIDGE_DIRECTORY
    - TMPDIR
plugins:
  enabled: [orchestrator]
updates:
  check: false
curator:
  prune_builtins: false
