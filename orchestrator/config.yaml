# Shipped defaults. prepare.py re-applies the keys the profile machinery relies on at every
# start (research_core/prepare.py PROTECTED_KEYS) and removes retired keys; every other value
# the owner changes is kept across `hermes profile update`.
# Hermes memory is off: standing instructions are directive records shown in the briefing, so
# compaction cannot lose them (design §9).
memory:
  memory_enabled: false
  user_profile_enabled: false
# Approvals are off and there is no deny list (design C.4). The per-context modes are backstops
# so an unattended run approves rather than blocks if the mode is ever reset.
approvals:
  mode: "off"
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: approve
# Orchestrator chats are long: protect more of the head and tail and compact less aggressively,
# so the user's instructions stay word for word (design F.5).
compression:
  protect_first_n: 6
  protect_last_n: 30
  threshold: 0.6
  target_ratio: 0.3
platform_toolsets:
  api_server: [hermes-api-server, ide-orchestrator]
  cron: []
known_plugin_toolsets:
  cron: [ide-orchestrator]
plugins:
  enabled: [orchestrator]
# Keep every profile tool loaded instead of deferred behind tool_search (design §4).
tools:
  tool_search:
    enabled: "off"
# Other authored cron jobs may catch up once after a wake; research serve owns observation.
cron:
  catch_up_missed: true
# The User identity token is deliberately NOT passed to terminal commands: User-identity actions
# go through the tools, which record an events row and a notice for each write (design B.16).
terminal:
  timeout: 1800
  env_passthrough:
    - SSL_CERT_FILE
    - SOFTMAX_PLAYER_ID
    - SOFTMAX_PLAYER_CREDENTIAL
    - COGAMES_API_URL
    - SOFTMAX_CONFIG_DIR
    - IDE_WORKSPACE
    - IDE_WORKSPACE_ENV
    - IDE_PLATFORM
    - IDE_FAKE_FAULTS
    - IDE_RESEARCHER_PROFILES
    - TMPDIR
# prepare.py fills these: the core skills (common and this role), and the active Coworld's
# mixin skills; the active Coworld's code repository is trusted for skill overrides.
skills:
  external_dirs: []
  trusted_project_dirs: []
updates:
  check: false
curator:
  prune_builtins: false
# Hermes's post-turn self-improvement review would patch the shipped skills (release content
# under skills.external_dirs); prepare.py keeps it off.
auxiliary:
  background_review:
    enabled: false
# Hermes's loop guard hard stop. Hermes leaves it off for api_server, which it treats as
# attended, but nobody watches a wake or a Task run. In Hermes v0.21.6 it turns on: a halt
# after 5 failures of one tool (same_tool_failure; never for terminal, execute_code and the
# other failure-tolerant tools); a block after 5 identical failing calls (Hermes's default
# exact_failure); and a halt after 10 identical calls with identical results, or 10 laps of an
# identical call cycle, for any tool but pollers (idempotent_no_progress, raised from 5 so a
# run polling a job with the same terminal command is not stopped). The warnings keep Hermes's
# defaults. prepare.py keeps these keys (PROTECTED_KEYS).
tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    same_tool_failure: 5
    idempotent_no_progress: 10
# Kimi K3.1 Pro and K3 run only on Moonshot's own OpenRouter endpoint: third-party hosts
# dropped tool-call arguments in long sessions. This is routing, not the model choice; it
# applies while the profile runs that model (prepare.py PROVIDER_ROUTING_MODELS adds it to
# older installs).
provider_routing:
  models:
    moonshotai/kimi-k3.1-pro:
      only: [moonshotai]
    moonshotai/kimi-k3:
      only: [moonshotai]
# The model is the profile's own setting: a new install starts here, prepare.py never changes it,
# and the bridge's /models route changes it on the user's request (contract/CONTRACT.md). It
# stays last: Hermes's writer moves a comment that follows a list into the list.
model:
  default: moonshotai/kimi-k3.1-pro
  provider: openrouter
fallback_providers:
  - provider: openrouter
    model: z-ai/glm-5.3
