[project]
name = "play"
version = "0.1.0"
description = "The user's own program on one coworld: starter, upload, practice, release"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "python-frontmatter",
    "PyYAML",
    "coworld>=0.1.67,<0.2",
    "softmax-cli>=0.26.40,<0.27",
]

[dependency-groups]
dev = ["jsonschema", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/play", "src/ide_research_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["hermes: needs a real Hermes install; excluded by default"]
addopts = "-m 'not hermes'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/ide_research_core"]  # generated by tools/sync_shared.py; linted at its source
