# Shipped defaults. Hermes keeps this file on `hermes profile update` (--force-config resets it).
# A researcher is a Kanban worker profile: the orchestrator assigns it cards on the
# `autoresearch` board and the gateway's dispatcher runs them (design: ide-distributions
# docs/designs/orchestrator-design-2026-10-15.html).
model:
  default: moonshotai/kimi-k3
  provider: openrouter
fallback_providers:
  - provider: openrouter
    model: z-ai/glm-5.3

# Knowledge lives in the canonical workspace, not in profile memory: N researchers share one
# game, and unprovenanced memory would diverge between them.
memory:
  memory_enabled: false
  user_profile_enabled: false

auxiliary:
  background_review:
    enabled: false

tool_loop_guardrails:
  hard_stop_enabled: true

agent:
  max_turns: 150
  run_budget_seconds: 5400

approvals:
  mode: "off"
  # Hermes matches these over the whole command and over each command word's tail
  # (tools/approval_detection.py _deny_command_variants), before mode and not overridable.
  # Promotion and league submission belong to the orchestrator.
  deny:
    - "coworld player use*"
    - "coworld submit*"
    - "coworld upload-policy*"
    - "coworld xp-request create*"
    - "softmax login*"
    - "git push -f*"
    - "git push*--force*"
    - "git push* -f*"
    - "hermes kanban create*"
    - "hermes kanban link*"
    - "hermes kanban --board * create*"
    - "hermes kanban --board * link*"
    - "*promotion submit"
    - "*promotion submit *"
    - "*promotion bootstrap"
    - "*promotion bootstrap *"
    - "*promotion release"
    - "*promotion release *"
    - "*promotion accept"
    - "*promotion accept *"

terminal:
  # Longest process_manage wait (Hermes clamps a wait to it) and the default foreground timeout.
  timeout: 1800
  env_passthrough:
    - SOFTMAX_PLAYER_CREDENTIAL
    - COGAMES_API_URL
    - RESEARCH_PLAYER_ID
    - RESEARCH_GAME
    - RESEARCH_WORKSPACE
    - RESEARCH_CANONICAL
    - RESEARCH_CLI
    - RESEARCH_SOFTMAX
    - OPENROUTER_MODEL
    - TMPDIR
    - SOFTMAX_COGENT_MODE
    - GOTA_G2_RUNNER

# Hermes cuts any single tool call after 420 s (agent/tool_executor.py), which would end a
# process_manage wait of up to terminal.timeout (1800) early. 1900 = that wait plus margin.
timeouts:
  tools:
    sequential_call: 1900
    concurrent_batch: 1900

# The IDE's core-loop tools, through the image's stdio proxy (a remote `headers:` entry is static and
# the loop token lives 15 minutes). The proxy is inert unless SOFTMAX_COGENT_MODE=core-loop, which only
# the autoresearch-next runtime sets; `${VAR}` placeholders left unresolved are treated as unset.
mcp_servers:
  ide:
    command: /opt/hermes/.venv/bin/python
    args: ["-m", "observatory_hosted_worker.ide_mcp"]
    env:
      PYTHONPATH: /opt/softmax
      SOFTMAX_COGENT_MODE: ${SOFTMAX_COGENT_MODE}
      SOFTMAX_PLAYER_CREDENTIAL: ${SOFTMAX_PLAYER_CREDENTIAL}
      SOFTMAX_PLAYER_ID: ${SOFTMAX_PLAYER_ID}
      COGAMES_API_URL: ${COGAMES_API_URL}
      # A researcher never submits: enter_league is hidden by Hermes and refused by the proxy.
      SOFTMAX_IDE_MCP_DENY: enter_league
    timeout: 400
    connect_timeout: 30
    tools:
      exclude: [enter_league]

plugins:
  enabled:
    - researcher_guard

# Hermes has no auto-update; this turns off its passive update check.
updates:
  check: false

# Shipped skills are never curator-managed; this pins built-in pruning off.
curator:
  prune_builtins: false
