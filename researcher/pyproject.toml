[project]
name = "researcher"
version = "0.1.0"
description = "Autoresearch v0: a Hermes Agent profile distribution"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "jsonschema",
    "python-frontmatter",
    "numpy",
    "PyYAML",
    "python-ulid",
    "scipy",
    "pandas",
    "coworld>=0.1.67,<0.2",
    "softmax-cli>=0.26.40,<0.27",
]

[project.scripts]
autoresearch = "ide_research_core.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ide_research_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["hermes: needs a real Hermes install; excluded by default"]
addopts = "-m 'not hermes'"

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored with SHA-256 provenance (PROVENANCE.md); keep bytes as pinned.
extend-exclude = ["games/gota/compiler"]
