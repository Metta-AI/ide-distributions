[project]
name = "researcher"
version = "0.1.0"
description = "Autoresearch v0: a Hermes Agent profile distribution"
requires-python = ">=3.12,<3.13"
# Generated from shared/pyproject.toml by tools/sync_shared.py; edit there.
dependencies = [
    "pydantic>=2",
    "python-frontmatter",
    "PyYAML",
    "coworld>=0.1.64,<0.2",
    "softmax-cli>=0.26.40,<0.27",
    "jsonschema",
    "numpy",
    "python-ulid",
    "scipy",
    "pandas",
]

[project.scripts]
autoresearch = "ide_research_core.cli:main"

[dependency-groups]
# Generated from shared/pyproject.toml.
dev = ["pytest", "ruff"]

[build-system]
# Generated from shared/pyproject.toml.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ide_research_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["hermes: needs a real Hermes install; excluded by default"]
addopts = "-m 'not hermes'"

[tool.ruff]
line-length = 100
target-version = "py312"
