name: researcher
version: 0.2.0
description: Research worker for the Softmax IDE. Works Kanban cards from the orchestrator on one game, in its own clone of the shared canonical workspace.
hermes_requires: ">=0.21.6"
env_requires:
  - name: OPENROUTER_API_KEY
    required: true
    description: OpenRouter API key for the research model.
  - name: SOFTMAX_PLAYER_CREDENTIAL
    required: true
    description: >-
      Credential of the Softmax player account the agent acts as: a bare cga_ agent
      token (what Softmax hosting provisions; it does not expire), or a Player session
      as JSON {"token": "ply_...", "expires_at": "<ISO 8601>"} (one entry of
      player_sessions.<server>.cache written by `coworld player use <ply_id>`).
  - name: RESEARCH_PLAYER_ID
    required: true
    description: Id of that Softmax player.
  - name: RESEARCH_CANONICAL
    required: true
    description: >-
      Path of the bare canonical repository of the game, shared by every profile on the
      host (for example <hermes root>/canonical-gota.git). `scripts/bootstrap.py` creates
      and seeds it when it does not exist yet.
  - name: RESEARCH_WORKSPACE
    required: false
    description: This profile's clone of the canonical repository. Default is $HERMES_HOME/workspace.
  - name: RESEARCH_GAME
    required: false
    default: gota
    description: Game to research. A directory name under games/.
  - name: COGAMES_API_URL
    required: false
    default: https://softmax.com/api
    description: >-
      Softmax API server. Every softmax/coworld call passes it as --server. Softmax
      hosting writes it to the profile .env.
  - name: OPENROUTER_MODEL
    required: false
    default: moonshotai/kimi-k3
    description: Model id on OpenRouter. Overrides the model in config.yaml.
  - name: TMPDIR
    required: false
    description: >-
      Scratch directory for builds and episodes. Set by Softmax hosting (/opt/data/tmp, because
      the sandbox /tmp is a small tmpfs); a manual install normally leaves it to the OS.
  - name: GOTA_G2_RUNNER
    required: false
    default: native
    description: >-
      GotA G2 episode runner. "native" runs the pinned native match binary and needs no
      Docker; "docker" runs pinned coworld run-episode (needs Docker).
  - name: RESEARCH_CREDIT_BACKOFF_MINUTES
    required: false
    default: "30"
    description: Minutes before the first relaunch of an experiment refused for credits (doubles per refusal, at most 8 hours).
  - name: RESEARCH_SOFTMAX
    required: false
    description: Set to "fake" in tests to use the fake Softmax tool instead of the real one.
